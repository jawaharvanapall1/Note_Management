<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notespace{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fc;
            color: #183153;
        }

        .topbar {
            height: 72px;
            padding: 0 30px;
            background: #ffffff;
            border-bottom: 1px solid #e8edf5;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
        }

        .profile-link {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 16px;
            background: #f0edff;
            color: #6254f5;
            border: 1px solid #e3ddff;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .profile-link:hover {
            background: #6254f5;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #eeeaff;
            color: #6254f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block body %}{% endblock %}

</body>
</html>
