
{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block body %}

<style>
    .register-page {
        min-height: 85vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 35px 16px;
        background: linear-gradient(135deg, #eef2ff, #f5f3ff, #e0f2fe);
        font-family: Arial, sans-serif;
    }

    .register-card {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 38px;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(31, 41, 55, 0.12);
    }

    .register-logo {
        width: 55px;
        height: 55px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 15px;
        background: #4f46e5;
        color: white;
        font-size: 28px;
        margin-bottom: 22px;
    }

    .register-card h2 {
        font-size: 28px;
        color: #111827;
        margin: 0 0 10px;
    }

    .register-subtitle {
        font-size: 14px;
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 26px;
    }

    .register-card .form-group {
        margin-bottom: 19px;
    }

    .register-card label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
    }

    .register-card input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        font-size: 14px;
        box-sizing: border-box;
        outline: none;
        background: #fff;
    }

    .register-card input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .password-box {
        position: relative;
    }

    .password-box input {
        padding-right: 65px;
    }

    .show-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: none;
        color: #4f46e5;
        font-weight: 600;
        cursor: pointer;
    }

    .register-error {
        background: #fef2f2;
        color: #b91c1c;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 18px;
        overflow-wrap: anywhere;
    }

    .register-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: #4f46e5;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 5px;
    }

    .register-btn:hover {
        background: #4338ca;
    }

    .register-login {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        margin-top: 24px;
    }

    .register-login a {
        color: #4f46e5;
        font-weight: 600;
        text-decoration: none;
        margin-left: 4px;
    }

    .register-login a:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .register-card {
            padding: 27px 22px;
        }
    }
</style>

<div class="register-page">
    <div class="register-card">

        <div class="register-logo">✎</div>

        <h2>Create account</h2>

        <p class="register-subtitle">
            Create your account and keep all your notes organized in one place.
        </p>

        {% if msg %}
            <div class="register-error">{{ msg }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="register-btn">
                Create Account →
            </button>

        </form>

        <p class="register-login">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>
</div>

<script>
    function togglePassword() {
        const password = document.getElementById("password");
        const button = document.querySelector(".show-password");

        if (password.type === "password") {
            password.type = "text";
            button.textContent = "Hide";
        } else {
            password.type = "password";
            button.textContent = "Show";
        }
    }
</script>

{% endblock %}
